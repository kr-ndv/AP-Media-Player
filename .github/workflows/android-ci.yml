name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and verify
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug

      - name: Rename debug APK
        if: success() && github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk AV-Music-Player-debug.apk

      - name: Upload debug APK
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AV-Music-Player-debug-${{ github.sha }}
          path: AV-Music-Player-debug.apk
          if-no-files-found: error
          retention-days: 14
