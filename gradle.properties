org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Temporarily use the legacy Android DSL because the external Kotlin plugin is not compatible with AGP 9's new DSL.
# Revisit this setting when migrating to the built-in Kotlin setup before moving to AGP 10.
android.newDsl=false

# Use the Kotlin Gradle plugin explicitly so its version stays aligned with the Compose compiler plugin.
# Revisit this setting when migrating to a future AGP release that removes the built-in Kotlin opt-out.
android.builtInKotlin=false
